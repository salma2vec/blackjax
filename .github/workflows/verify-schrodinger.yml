name: Verify corrected Schrodinger-Follmer estimator

on:
  push:
    branches: [codex/verify-schrodinger-final-gates]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Install native test environment
        run: uv sync --group dev --extra progress
      - name: Reproduce through public API
        run: |
          uv run --frozen python - <<'PY' >public-after.txt
          import importlib.metadata
          import blackjax
          import jax
          import jax.numpy as jnp
          for name in ['blackjax', 'jax', 'jaxlib', 'numpy', 'chex', 'optax']:
              print(name, importlib.metadata.version(name))
          logdensity = lambda x: -0.5 * jnp.sum((x - 0.4)**2)
          algorithm = blackjax.schrodinger_follmer(logdensity, 4, 4)
          key = jax.random.key(0)
          _, matrix_info = algorithm.step(key, algorithm.init(jnp.zeros((4, 3))))
          _, vector_info = algorithm.step(key, algorithm.init(jnp.zeros(12)))
          print('matrix drift:', matrix_info.drift)
          print('equivalent flat drift:', vector_info.drift.reshape(4, 3))
          print('max absolute difference:', jnp.max(jnp.abs(matrix_info.drift - vector_info.drift.reshape(4, 3))))
          PY
          cat public-after.txt
      - name: Check final regressions on unchanged production
        run: |
          cp blackjax/vi/schrodinger_follmer.py /tmp/schrodinger-candidate.py
          git show 2d6a51c3b0f7b4a221ac7ba218be09b97f1df608:blackjax/vi/schrodinger_follmer.py > blackjax/vi/schrodinger_follmer.py
          set +e
          uv run --frozen pytest tests/vi/test_schrodinger_follmer.py -k 'sample_axis or flat_coordinates' --benchmark-disable -q --junitxml=before.xml >before.txt 2>&1
          status=$?
          set -e
          cp /tmp/schrodinger-candidate.py blackjax/vi/schrodinger_follmer.py
          cat before.txt
          test "$status" -eq 1
          uv run --frozen python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('before.xml').getroot()
          suites = list(root.iter('testsuite'))
          counts = {key: sum(int(s.get(key, 0)) for s in suites) for key in ['tests', 'failures', 'errors', 'skipped']}
          assert counts == {'tests': 30, 'failures': 16, 'errors': 0, 'skipped': 6}, counts
          failures = [c for c in root.iter('testcase') if c.find('failure') is not None]
          expected = ['pytree_samples_match_flat_coordinates', 'sample_axis_matrix__', 'sample_axis_matrix_matching_sample_count', 'sample_axis_tensor']
          assert all(any(name in c.get('name') for name in expected) for c in failures)
          print('Confirmed expected baseline regression counts:', counts)
          PY
      - name: Run complete native Schrodinger-Follmer tests
        run: |
          uv run --frozen pytest tests/vi/test_schrodinger_follmer.py --benchmark-disable -q --junitxml=after.xml >after.txt 2>&1
          cat after.txt
          sha256sum blackjax/vi/schrodinger_follmer.py tests/vi/test_schrodinger_follmer.py > source-sha256.txt
      - name: Exercise all new pmap cases on four CPU devices
        env:
          XLA_FLAGS: --xla_force_host_platform_device_count=4
        run: uv run --frozen pytest tests/vi/test_schrodinger_follmer.py -k with_pmap --benchmark-disable -q --junitxml=pmap.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schrodinger-after
          path: |
            public-after.txt
            after.xml
            after.txt
            source-sha256.txt
            before.xml
            before.txt
            pmap.xml
